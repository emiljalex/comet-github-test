<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Comet GitHub Test</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    color: #222;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  h1 {
    color: #2c3e50;
  }
  p {
    font-size: 18px;
    max-width: 500px;
    text-align: center;
  }
  button {
    padding: 10px 20px;
    font-size: 16px;
    background-color: #2c7be5;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  button:hover {
    background-color: #1a5bb8;
  }
</style>
</head>
<body>
  <h1>Comet GitHub Test</h1>
  <p id="message">This is a simple test webpage created for the comet-github-test repository.</p>
  <button onclick="changeText()">Click Me</button>

  <script>
    function changeText() {
      document.getElementById('message').textContent = 'You clicked the button! This text was changed with JavaScript.';
    }
  </script>
</body>
</html>
